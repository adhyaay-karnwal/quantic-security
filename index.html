<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f4">
    <meta name="description" content="Nectar Security prototype — an evidence-led, reviewable security operations workflow.">
    <title>Nectar Security — Overview</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="primary-navigation" aria-label="Primary navigation">
        <a class="brand" href="#" data-view="overview" aria-label="Nectar Security overview">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M16 3.5c4.1 0 6.9 4.2 5.3 8l-1.1 2.4-2.4 1.1c-3.8 1.6-8-1.2-8-5.3A6.2 6.2 0 0 1 16 3.5Z" fill="currentColor" opacity=".95"/>
              <path d="M28.5 16c0 4.1-4.2 6.9-8 5.3l-2.4-1.1-1.1-2.4c-1.6-3.8 1.2-8 5.3-8 3.4 0 6.2 2.8 6.2 6.2Z" fill="currentColor" opacity=".72"/>
              <path d="M16 28.5c-4.1 0-6.9-4.2-5.3-8l1.1-2.4 2.4-1.1c3.8-1.6 8 1.2 8 5.3 0 3.4-2.8 6.2-6.2 6.2Z" fill="currentColor" opacity=".55"/>
              <path d="M3.5 16c0-4.1 4.2-6.9 8-5.3l2.4 1.1 1.1 2.4c1.6 3.8-1.2 8-5.3 8A6.2 6.2 0 0 1 3.5 16Z" fill="currentColor" opacity=".82"/>
            </svg>
          </span>
          <span class="brand-copy"><strong>Nectar</strong><span>SECURITY</span></span>
        </a>

        <button class="workspace-picker" type="button" data-view="setup" aria-label="Open workspace scope settings">
          <span class="workspace-avatar">N</span>
          <span class="workspace-label"><strong>Nectar sandbox</strong><small>Preview workspace</small></span>
          <span class="workspace-chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="nav-section-label">WORKSPACE</div>
        <nav class="primary-nav">
          <button class="nav-link active" type="button" data-view="overview" aria-current="page">
            <span class="nav-icon" data-icon="grid" aria-hidden="true"></span><span>Overview</span>
          </button>
          <button class="nav-link" type="button" data-view="findings">
            <span class="nav-icon" data-icon="shield" aria-hidden="true"></span><span>Findings</span><span class="nav-count">04</span>
          </button>
          <button class="nav-link" type="button" data-view="approvals">
            <span class="nav-icon" data-icon="check" aria-hidden="true"></span><span>Review queue</span><span class="nav-count nav-count-accent">01</span>
          </button>
          <button class="nav-link" type="button" data-view="evaluations">
            <span class="nav-icon" data-icon="chart" aria-hidden="true"></span><span>Evaluations</span>
          </button>
        </nav>

        <div class="nav-section-label nav-section-spaced">CONFIGURATION</div>
        <nav class="primary-nav">
          <button class="nav-link" type="button" data-view="setup">
            <span class="nav-icon" data-icon="scope" aria-hidden="true"></span><span>Scope &amp; access</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="preview-state">
            <span class="state-dot"></span>
            <span><strong>Fixture mode</strong><small>No providers connected</small></span>
          </div>
          <div class="sidebar-user">
            <span class="user-avatar">A</span>
            <span><strong>Alex Morgan</strong><small>Security lead · demo</small></span>
            <button class="more-button" type="button" aria-label="More workspace options">···</button>
          </div>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
              <span></span><span></span>
            </button>
            <div class="breadcrumbs"><span>Nectar sandbox</span><span class="crumb-separator">/</span><strong id="current-section">Overview</strong></div>
          </div>
          <div class="topbar-actions">
            <span class="environment-pill"><span class="environment-dot"></span>SYNTHETIC PREVIEW</span>
            <button class="top-icon-button" type="button" data-view="evaluations" aria-label="Help and evaluations"><span data-icon="help" aria-hidden="true"></span></button>
            <span class="top-avatar" aria-label="Alex Morgan">AM</span>
          </div>
        </header>

        <div id="app-content" class="page-content" aria-live="polite" aria-busy="true">
          <div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>Loading local fixtures…</span></div>
        </div>
      </main>
    </div>
    <div class="mobile-scrim" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
